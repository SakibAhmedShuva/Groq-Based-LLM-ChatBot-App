<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Studio</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <aside class="left-sidebar">
            <div class="logo" id="app-logo">My AI Studio</div>
            <nav>
                <ul>
                    <li class="active" id="nav-chat"><span class="icon">💬</span> Chat</li>
                    <li id="nav-stream"><span class="icon">🌊</span> Stream <small>(Chat)</small></li>
                    <li id="nav-stt"><span class="icon">🎤</span> Speech-to-Text</li>
                    <li id="nav-tts"><span class="icon">🗣️</span> Text-to-Speech</li>
                    <li id="nav-history"><span class="icon">📜</span> History</li>
                </ul>
            </nav>
            <!-- Footer removed -->
        </aside>

        <main class="main-content">
            <header class="main-header">
                 <h2>Chat Prompt</h2>
                <div class="main-header-actions">
                    <button class="icon-btn" id="new-chat-btn" title="New Chat">📄</button>
                    <!-- Other buttons removed -->
                </div>
            </header>

            <div class="chat-interface">
                <div id="chat-output">
                    <div class="welcome-message">
                        <h1 id="welcome-header">Welcome to My AI Studio</h1>
                    </div>
                </div>
                <div class="system-prompt-container">
                    <textarea id="system-prompt-input" placeholder="System Prompt (e.g., You are a poetic assistant that responds in rhyme.)"></textarea>
                </div>
                <div class="prompt-suggestions">
                    <button class="suggestion-btn">Solve geometry problems with an image.</button>
                    <button class="suggestion-btn">Find the next shape in a sequence.</button>
                    <button class="suggestion-btn">Create a scavenger hunt.</button>
                </div>
                <div class="prompt-input-area">
                    <!-- Attach button removed -->
                    <textarea id="prompt-input" placeholder="User prompt... (Press Enter to send)"></textarea>
                    <button id="run-button">Run <span class="shortcut">↵</span></button>
                </div>
            </div>
        </main>

        <aside class="right-sidebar">
            <div class="right-sidebar-header">
                <h3>Run settings</h3>
                <div class="actions">
                    <button class="icon-btn-sm" id="reset-settings-btn" title="Reset Settings">🔄</button>
                    <!-- Close button removed -->
                </div>
            </div>
            <div class="settings-section">
                <select id="model-select">
                    <!-- Options will be populated by JavaScript -->
                </select>
                <div id="model-info" class="model-info-text">
                    <!-- Model rate limits will be displayed here -->
                </div>
                <div class="setting-item">
                    <span>Token count</span>
                    <span id="token-count">0 / --</span>
                </div>
                <div class="setting-item">
                    <label for="temperature">Temperature</label>
                    <input type="range" id="temperature" name="temperature" min="0" max="1" step="0.1" value="0.7">
                    <input type="number" id="temperature-value" value="0.7" min="0" max="1" step="0.1">
                </div>
            </div>
            <div class="settings-section tools-section">
                <h4>Tools <span class="toggle-arrow">^</span></h4>
                <div class="tool-item">
                    <span>Structured output <small>(Future)</small></span>
                    <!-- Edit button removed -->
                    <label class="switch">
                        <input type="checkbox" id="tool-structured-output">
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="tool-item">
                    <span>Function calling <small>(Future)</small></span>
                     <!-- Edit button removed -->
                    <label class="switch">
                        <input type="checkbox" id="tool-function-calling">
                        <span class="slider round"></span>
                    </label>
                </div>
                <!-- Code execution and Grounding removed -->
            </div>
            <!-- Advanced settings section removed -->
        </aside>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
